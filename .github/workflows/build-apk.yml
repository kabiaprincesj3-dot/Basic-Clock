name: Build Basic Clock Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/ibtechsolution/basicclock
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'BasicClockApp'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ibtechsolution.basicclock'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.ibtechsolution.basicclock'
                  minSdk 23
                  targetSdk 28
                  versionCode 2
                  versionName '1.0.1'
              }

              signingConfigs {
                  release {
                      storeFile file("${rootProject.projectDir}/release-key.jks")
                      storePassword "basicclock123"
                      keyAlias "basicclock"
                      keyPassword "basicclock123"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Basic Clock"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style name="AppTheme"
                  parent="Theme.AppCompat.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2196F3</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">

              <TextView
                  android:id="@+id/timeText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="00:00:00"
                  android:textSize="52sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/dateText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="Monday, January 1, 2026"
                  android:textSize="20sp" />

          </LinearLayout>
          EOF

          cat > app/src/main/java/com/ibtechsolution/basicclock/MainActivity.java <<'EOF'
          package com.ibtechsolution.basicclock;

          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.TextView;

          import androidx.appcompat.app.AppCompatActivity;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends AppCompatActivity {

              private TextView timeText;
              private TextView dateText;

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private final Runnable clockRunnable = new Runnable() {
                  @Override
                  public void run() {

                      Date now = new Date();

                      SimpleDateFormat timeFormat =
                              new SimpleDateFormat(
                                      "HH:mm:ss",
                                      Locale.getDefault()
                              );

                      SimpleDateFormat dateFormat =
                              new SimpleDateFormat(
                                      "EEEE, MMMM d, yyyy",
                                      Locale.getDefault()
                              );

                      timeText.setText(timeFormat.format(now));
                      dateText.setText(dateFormat.format(now));

                      handler.postDelayed(this, 1000);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setContentView(R.layout.activity_main);

                  timeText = findViewById(R.id.timeText);
                  dateText = findViewById(R.id.dateText);

                  handler.post(clockRunnable);
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacks(clockRunnable);
                  super.onDestroy();
              }
          }
          EOF

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create release signing key
        shell: bash
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore release-key.jks \
            -alias basicclock \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass basicclock123 \
            -keypass basicclock123 \
            -dname "CN=IB TECH SOLUTION, OU=Basic Clock, O=IB TECH SOLUTION, L=Freetown, ST=Western Area, C=SL"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build signed release APK
        shell: bash
        run: |
          set -e

          gradle assembleRelease --no-daemon

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "Release APK was not created."
            exit 1
          fi

          apksigner verify --verbose "$APK"

          echo "APK successfully built and signed:"
          ls -lh "$APK"

      - name: Rename APK
        shell: bash
        run: |
          cp \
            app/build/outputs/apk/release/app-release.apk \
            Basic-Clock-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Basic-Clock-Release
          path: Basic-Clock-release.apk
          if-no-files-found: error
