name: Build Basic Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Java
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Configure Android SDK
      # --------------------------------------------------
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          if [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

      # --------------------------------------------------
      # 4. Install required Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK
        run: |
          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # --------------------------------------------------
      # 5. Create Android project
      # --------------------------------------------------
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/ibtechsolution/basicclock
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'BasicClockApp'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ibtechsolution.basicclock'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.ibtechsolution.basicclock'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Basic Clock"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="Theme.MaterialComponents.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">

              <TextView
                  android:id="@+id/timeText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="00:00:00"
                  android:textSize="56sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/dateText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="Monday, January 1, 2026"
                  android:textSize="20sp" />

          </LinearLayout>
          EOF

          cat > app/src/main/java/com/ibtechsolution/basicclock/MainActivity.java <<'EOF'
          package com.ibtechsolution.basicclock;

          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.TextView;

          import androidx.appcompat.app.AppCompatActivity;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends AppCompatActivity {

              private TextView timeText;
              private TextView dateText;

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private final Runnable clockRunnable = new Runnable() {

                  @Override
                  public void run() {

                      Date now = new Date();

                      SimpleDateFormat timeFormat =
                              new SimpleDateFormat(
                                      "HH:mm:ss",
                                      Locale.getDefault()
                              );

                      SimpleDateFormat dateFormat =
                              new SimpleDateFormat(
                                      "EEEE, MMMM d, yyyy",
                                      Locale.getDefault()
                              );

                      timeText.setText(timeFormat.format(now));
                      dateText.setText(dateFormat.format(now));

                      handler.postDelayed(this, 1000);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setContentView(R.layout.activity_main);

                  timeText = findViewById(R.id.timeText);
                  dateText = findViewById(R.id.dateText);

                  handler.post(clockRunnable);
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacks(clockRunnable);
                  super.onDestroy();
              }
          }
          EOF

      # --------------------------------------------------
      # 6. Generate Gradle wrapper
      # --------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9

      # --------------------------------------------------
      # 7. Build APK
      # --------------------------------------------------
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      # --------------------------------------------------
      # 8. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Basic-Clock-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
